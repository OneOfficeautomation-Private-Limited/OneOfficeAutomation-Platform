[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneofficeautomation-reference"
version = "0.1.0"
description = "ONEOFFICEAUTOMATION Python reference Runner, Package SDK and agent runtime (MVP slice 1)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.21", "cryptography>=42", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ooa = "ooa.cli:main"

[tool.setuptools.packages.find]
include = ["ooa*"]

[tool.setuptools.package-data]
"ooa.runner" = ["flow.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
