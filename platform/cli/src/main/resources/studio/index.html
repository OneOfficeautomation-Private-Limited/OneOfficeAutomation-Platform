<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONEOFFICEAUTOMATION One Agent Studio</title>
  <link rel="icon" href="logo-mark.png">
  <link rel="stylesheet" href="ooa-tokens.css">
  <link rel="stylesheet" href="ooa-components.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body data-theme="brand" class="dock-bottom">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="logo-mark.png" alt="">
      <span class="brand-name">ONEOFFICEAUTOMATION</span>
      <span class="brand-product">One Agent Studio</span>
    </div>
    <button type="button" class="icon-btn" id="btn-home" aria-label="Automation home" title="Automation home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></button>
    <nav class="crumbs" id="crumbs" aria-label="Open item"></nav>
    <button type="button" class="icon-btn close-btn" id="btn-close" aria-label="Close the open item" title="Close and return to the Automation home (asks to save changes)" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="actions">
      <span id="dirty" class="dirty" hidden>Unsaved</span>
      <a id="btn-open-cr" class="button-link" href="../" target="ooa-control-room" hidden title="Open Command Center (agent repository, runners, runs) in another tab">One Command Center</a>
      <div class="panel-toggles" aria-label="Panels">
        <button type="button" class="icon-btn" id="tg-left" aria-label="Show or hide the left panel" title="Left panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button type="button" class="icon-btn" id="tg-dock" aria-label="Show or hide the run dock" title="Run dock">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></svg></button>
        <button type="button" class="icon-btn" id="tg-right" aria-label="Show or hide action settings" title="Action settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
      </div>
      <div class="view-menu">
        <button type="button" class="icon-btn" id="btn-view" aria-label="Theme and density" aria-expanded="false" title="Theme and density">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
        <div class="popover" id="view-pop" hidden>
          <label>Theme
            <select id="sel-theme">
              <option value="brand">One Light (blue)</option>
              <option value="midnight">One Dark</option>
              <option value="teal">Ocean teal</option>
              <option value="graphite">Graphite</option>
              <option value="sunrise">Sunrise orange</option>
            </select>
          </label>
          <label>Density
            <select id="sel-density"><option value="compact">Compact (more steps on screen)</option><option value="comfortable">Comfortable</option></select>
          </label>
          <button type="button" id="btn-connections" title="Named language-model settings used by AI actions, Prompt Skills and the assistant">One Model Connections&#8230;</button>
          <button type="button" id="btn-connectors" title="Import an OpenAPI, Swagger or Postman file as a custom connector agents can call">Connectors&#8230;</button>
        </div>
      </div>
      <button id="btn-save" type="button" title="Save (Ctrl+S)">Save</button>
      <button id="btn-validate" type="button">Validate</button>
      <button id="btn-assistant" type="button" title="Build steps from a description, or explain this agent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Assistant</button>
      <button id="btn-debug" type="button" title="Run with the debugger: stops at breakpoints (F9 on a step) or before the first step"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h8v10a4 4 0 0 1-8 0zM9 8a3 3 0 0 1 6 0M4 12h4M16 12h4M4 18h4M16 18h4M5 6l3 2M19 6l-3 2"/></svg>Debug</button>
      <button id="btn-run" type="button" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>Run</button>
    </div>
  </header>

  <div class="workbench" id="workbench">
    <nav class="rail" aria-label="Agent Studio sections">
      <button type="button" class="rail-btn active" data-side="explorer" aria-label="Explorer" title="Explorer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg></button>
      <button type="button" class="rail-btn" data-side="commands" aria-label="Actions" title="Actions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      <button type="button" class="rail-btn" data-side="variables" aria-label="Variables" title="Variables">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4c-2 0-2 2-2 4s-1 3-2 4c1 1 2 2 2 4s0 4 2 4M16 4c2 0 2 2 2 4s1 3 2 4c-1 1-2 2-2 4s0 4-2 4"/></svg></button>
      <button type="button" class="rail-btn" data-side="triggers" aria-label="Triggers" title="Triggers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
    </nav>

    <aside class="side" id="side" aria-label="Side panel">
      <div id="side-explorer" class="side-body">
        <div class="side-head"><span>Explorer</span></div>
        <div class="toolbar">
          <div class="create-menu">
            <button type="button" id="btn-create" class="primary small" aria-haspopup="menu" aria-expanded="false" title="Create an agent, form, workflow, document intelligence, Prompt Skill or script">+ Create</button>
            <div class="menu" id="create-pop" role="menu" hidden></div>
          </div>
          <button type="button" id="btn-new-folder" title="New folder inside the selected folder">+ Folder</button>
          <button type="button" id="btn-rename">Rename</button>
          <button type="button" id="btn-delete" class="danger" title="Move to the workspace trash">Delete</button>
          <button type="button" id="btn-refresh" aria-label="Refresh" title="Refresh">&#8635;</button>
          <button type="button" id="btn-checkin" title="Check the open agent in to the Command Center agent repository as a new version">Agent check-in</button>
        </div>
        <label class="sr-only" for="tree-search">Search agents</label>
        <input id="tree-search" type="search" placeholder="Search agents by name, description or action">
        <div id="search-results" class="tree" hidden></div>
        <div id="tree" class="tree" role="tree"></div>
        <div id="workspace-path" class="ws-path"></div>
        <details id="cr-panel" class="cr-panel" open>
          <summary>Command Center <span id="cr-state" class="muted"></span></summary>
          <div id="cr-body"></div>
        </details>
      </div>
      <div id="side-commands" class="side-body" hidden>
        <div class="side-head"><span>Actions <span id="cmd-count" class="muted"></span></span>
          <button type="button" class="link-btn" id="btn-fold-groups">Collapse all</button></div>
        <label class="sr-only" for="cmd-search">Search actions</label>
        <input id="cmd-search" type="search" placeholder="Search actions">
        <div class="hint">Click to add, or drag onto the canvas.</div>
        <div id="library" class="library-list"></div>
      </div>
      <div id="side-variables" class="side-body" hidden></div>
      <div id="side-triggers" class="side-body" hidden></div>
    </aside>

    <section class="center" id="center">
      <div id="welcome" class="welcome"></div>
      <div id="item-editor" class="item-editor" hidden></div>
      <div id="editor-body" class="editor-body" hidden>
        <nav class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="steps">Canvas</button>
          <button type="button" class="tab" data-tab="settings">Agent settings</button>
          <button type="button" class="tab" data-tab="deps">Dependencies</button>
          <button type="button" class="tab" data-tab="json">JSON</button>
        </nav>
        <div class="canvas-bar" id="canvas-bar" role="toolbar" aria-label="Canvas tools">
          <div class="btn-group">
            <button type="button" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
            <button type="button" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
          </div>
          <div class="btn-group">
            <button type="button" id="btn-cut" title="Cut (Ctrl+X)">Cut</button>
            <button type="button" id="btn-copy" title="Copy (Ctrl+C)">Copy</button>
            <button type="button" id="btn-paste" title="Paste after the selection (Ctrl+V)">Paste</button>
            <button type="button" id="btn-del" class="danger" title="Delete (Del)">Delete</button>
          </div>
          <div class="btn-group">
            <button type="button" id="btn-dup" title="Duplicate the selected steps (Ctrl+D)">Duplicate</button>
            <button type="button" id="btn-toggle" title="Disable or enable the selected steps (Ctrl+/)">Disable</button>
            <button type="button" id="btn-up" title="Move the selected steps up (Alt+Up)" aria-label="Move up">&#8593;</button>
            <button type="button" id="btn-down" title="Move the selected steps down (Alt+Down)" aria-label="Move down">&#8595;</button>
          </div>
          <div class="btn-group">
            <button type="button" id="btn-share-copy" title="Copy the selected steps to the shared clipboard, to paste into another agent">Copy to shared</button>
            <button type="button" id="btn-share-paste" title="Paste steps from the shared clipboard">Paste shared</button>
          </div>
          <button type="button" id="btn-record" class="record-btn" title="Record actions in a web browser"><span class="rec-dot"></span>Record</button>
          <button type="button" id="btn-capture" title="Capture one element in a web page and add an action for it">Capture</button>
          <button type="button" id="btn-capture-desktop" title="Capture one control in a Windows application (hover it and press Ctrl+Shift+C) and add an action for it">Capture desktop</button>
          <button type="button" id="btn-to-objects" title="Run the agent once and put captured objects in place of the selectors of its web steps">Selectors to objects</button>
          <div class="seg canvas-mode" role="group" aria-label="Canvas view">
            <button type="button" data-canvas-mode="list" aria-pressed="true" title="Edit steps as a list">List</button>
            <button type="button" data-canvas-mode="flow" aria-pressed="false" title="See the agent as a flow diagram">Flow</button>
          </div>
          <button type="button" id="btn-quick-add" title="Find an action by typing (Ctrl+K or /)">+ Quick add</button>
          <button type="button" id="btn-expand-all">Expand all</button>
          <button type="button" id="btn-collapse-all">Collapse all</button>
          <span class="muted" id="canvas-stats"></span>
          <span class="sel-count" id="sel-count" role="status" hidden></span>
          <span class="spacer"></span>
          <span class="hint" id="insert-hint"></span>
        </div>
        <div id="tab-steps" class="tab-body canvas-bg"><div id="steps" class="steps"></div></div>
        <div id="tab-settings" class="tab-body" hidden></div>
        <div id="tab-deps" class="tab-body" hidden></div>
        <div id="tab-json" class="tab-body" hidden>
          <textarea id="json-text" spellcheck="false" aria-label="Agent JSON"></textarea>
          <div class="row-actions">
            <button id="btn-json-apply" type="button">Apply JSON</button>
            <button id="btn-json-format" type="button">Format</button>
          </div>
        </div>
      </div>
      <section class="dock" id="dock" aria-label="Run dock">
        <div class="dock-head" id="dock-head">
          <nav class="dock-tabs" role="tablist">
            <button type="button" class="ctab active" data-ctab="run">Run</button>
            <button type="button" class="ctab" data-ctab="problems">Problems <span id="problem-count" class="count"></span></button>
            <button type="button" class="ctab" data-ctab="events">Run log</button>
            <button type="button" class="ctab" data-ctab="vars">Variables</button>
          </nav>
          <div class="mini-status" id="mini-status"></div>
          <span class="spacer"></span>
          <label class="dock-pos">Dock
            <select id="sel-dock"><option value="bottom">Bottom</option><option value="right">Right</option><option value="float">Floating</option><option value="mini">Mini bar</option></select>
          </label>
          <button type="button" class="link-btn" id="btn-dock-min">Minimise</button>
        </div>
        <div class="run-progress" id="run-progress" hidden><div></div></div>
        <div id="ctab-run" class="ctab-body"></div>
        <div id="ctab-problems" class="ctab-body" hidden></div>
        <div id="ctab-events" class="ctab-body" hidden></div>
        <div id="ctab-vars" class="ctab-body" hidden></div>
      </section>
    </section>

    <aside class="props" id="props-panel" aria-label="Action settings">
      <div class="side-head"><span>Action settings</span>
        <button type="button" class="link-btn" id="btn-props-collapse">Collapse</button></div>
      <div id="props" class="props-body"></div>
    </aside>
  </div>

  <div id="dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body" class="dialog-body"></div>
      <div class="row-actions" id="dialog-actions"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="studio.js"></script>
</body>
</html>
