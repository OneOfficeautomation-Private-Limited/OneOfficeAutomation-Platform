apiVersion: v1
kind: Service
metadata:
  name: {{ include "ooa.fullname" . }}
  labels:
    {{- include "ooa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "ooa.selector" . | nindent 4 }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ooa.fullname" . }}-data
  labels:
    {{- include "ooa.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # the data outlives an uninstall
spec:
  accessModes: [ {{ .Values.persistence.accessMode }} ]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ooa.fullname" . }}
  labels:
    {{- include "ooa.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts: [ {{ .Values.ingress.host | quote }} ]
      secretName: {{ .Values.ingress.tlsSecret | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ooa.fullname" . }}
                port: { name: http }
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ooa.fullname" . }}
  labels:
    {{- include "ooa.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "ooa.selector" . | nindent 6 }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ooa.fullname" . }}
  labels:
    {{- include "ooa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ooa.selector" . | nindent 6 }}
  policyTypes: [ Ingress, Egress ]
  ingress:
    - ports: [ { port: 8720, protocol: TCP } ]
  egress:
    - ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 1433, protocol: TCP }
        - { port: 5432, protocol: TCP }
        {{- range .Values.networkPolicy.extraEgressPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
{{- end }}
