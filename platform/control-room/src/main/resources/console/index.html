<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONEOFFICEAUTOMATION One CommandCenter</title>
  <link rel="icon" href="/logo-mark.png">
  <link rel="stylesheet" href="/ooa-tokens.css">
  <link rel="stylesheet" href="/ooa-components.css">
  <link rel="stylesheet" href="/cr.css">
  <script src="/ooa-i18n.js"></script>
</head>
<body>
  <div id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <img src="/logo-full.png" alt="ONEOFFICEAUTOMATION" class="login-logo">
      <h1>One CommandCenter</h1>
      <label>User name <input id="login-user" autocomplete="username" required></label>
      <label>Password <input id="login-pass" type="password" autocomplete="current-password" required></label>
      <label id="login-code-row" hidden>Code from your authenticator app (or a recovery code)
        <input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="12"></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="login-error" class="error" role="alert" hidden></p>
      <div id="sso-box"></div>
    </form>
  </div>

  <div id="password-view" class="login" hidden>
    <form id="password-form" class="card login-card">
      <h1>Choose a new password</h1>
      <p class="muted">At least 12 characters, with letters and digits.</p>
      <label>Current password <input id="pw-current" type="password" autocomplete="current-password" required></label>
      <label>New password <input id="pw-new" type="password" autocomplete="new-password" required></label>
      <label>Repeat new password <input id="pw-repeat" type="password" autocomplete="new-password" required></label>
      <button type="submit" class="primary">Change password</button>
      <p id="pw-error" class="error" role="alert" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <img src="/logo-mark.png" alt="" class="logo">
      <span class="brand-name">ONEOFFICEAUTOMATION</span>
      <span class="brand-product">One CommandCenter</span>
      <span class="spacer"></span>
      <a id="btn-studio" class="button-link" href="/studio/" target="_blank" rel="noopener" hidden title="Build and test agents in One AgentStudio (this computer; opens in a new tab)">Open One AgentStudio</a>
      <button type="button" id="btn-theme" aria-label="Switch between light and dark" title="Light or dark">&#9680;</button>
      <div class="user-menu">
        <button type="button" id="btn-user" class="user-btn" aria-haspopup="true" aria-expanded="false" aria-controls="user-pop">
          <span id="avatar" class="avatar" aria-hidden="true"></span><span id="who"></span><span class="user-caret" aria-hidden="true">&#9662;</span>
        </button>
        <div id="user-pop" class="user-pop" hidden>
          <div id="user-pop-head" class="user-pop-head"></div>
          <button type="button" id="btn-apikeys" title="Keys for other systems to call the Command Center as you">API keys</button>
          <button type="button" id="btn-change-pw">Change password</button>
          <button type="button" id="btn-mfa">Two-step sign-in</button>
          <label class="lang-row">Language <select data-ooa-lang aria-label="Language"></select></label>
          <button type="button" id="btn-logout">Sign out</button>
        </div>
      </div>
    </header>
    <div id="announcement" class="announcement" role="status" hidden></div>
    <div id="license-banner" class="announcement license-banner" role="alert" hidden></div>
    <div class="layout">
      <nav id="nav" class="nav" aria-label="Command Center sections"></nav>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer" class="drawer" hidden>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer-head">
        <h2 id="drawer-title"></h2>
        <div id="drawer-actions" class="row-actions tight"></div>
        <button type="button" id="drawer-close" class="icon-close" aria-label="Close">&#x2715;</button>
      </header>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="row-actions" id="modal-actions"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/cr.js"></script>
</body>
</html>
