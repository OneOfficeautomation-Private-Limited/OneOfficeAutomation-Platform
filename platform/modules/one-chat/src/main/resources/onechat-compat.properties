# One Chat: the OneChat service (repository OneOfficeAutomation-OneChat) this One CommandCenter is built and tested with.
# See docs/integration/one-chat-contract.md, section 8. Change these only together with a CI run against that OneChat.
#
# contract  the OneChat API version One CommandCenter calls (/api/chat/v1) and answers (/api/onechat-callback/v1)
