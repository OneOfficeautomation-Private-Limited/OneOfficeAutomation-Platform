# Optional command modules (comma-separated). If one fails to build on your machine, remove it from this list:
# the rest of the platform, and every other package, keeps working. Its commands disappear from Studio until restored.
ooa.optionalModules=packages-office,packages-email,packages-pdf,packages-browser,packages-transfer,packages-windows

org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
