<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editor B: icon and text</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; font-size: 12.5px; color: #17202b; background: #ffffff">
  <div style="height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #d5dbe4">
    <b style="font-size: 13.5px">Post invoices to the ledger</b>
    <span style="flex: 1"></span>
    <div style="display: flex; border: 1px solid #7d8797; border-radius: 6px; overflow: hidden">
      <button style="height: 24px; padding: 0 9px; border: 0; background: #ffffff; font: inherit; font-size: 11.5px; font-weight: 600">✦ Assistant</button>
      <button style="height: 24px; padding: 0 9px; border: 0; border-left: 1px solid #7d8797; background: #ffffff; font: inherit; font-size: 11.5px; font-weight: 600">⌖ Capture</button>
      <button style="height: 24px; padding: 0 9px; border: 0; border-left: 1px solid #7d8797; background: #ffffff; font: inherit; font-size: 11.5px; font-weight: 600"><span style="color: #b42318">●</span> Record</button>
    </div>
    <span style="flex: 1"></span>
    <div style="display: flex; gap: 0">
      <button style="height: 26px; padding: 0 10px; border: 0; border-radius: 5px 0 0 5px; background: #1d5fd1; color: #ffffff; font: inherit; font-size: 12px; font-weight: 600">Save</button>
      <button style="height: 26px; padding: 0 6px; border: 0; border-left: 1px solid #5d8fe6; border-radius: 0 5px 5px 0; background: #1d5fd1; color: #ffffff; font: inherit; font-size: 11px">▾</button>
    </div>
    <button style="height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: #15803d; color: #ffffff; font: inherit; font-size: 12px; font-weight: 600">▶ Run</button>
    <button style="height: 26px; padding: 0 10px; border: 0; border-radius: 5px; background: #b45309; color: #ffffff; font: inherit; font-size: 12px; font-weight: 600">Debug</button>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <aside style="width: 260px; flex: none; border-right: 1px solid #d5dbe4; display: flex; flex-direction: column">
      <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #e3e7ee">
        <div style="display: flex; gap: 6px">
          <button style="flex: 1; height: 26px; border: 2px solid #1d5fd1; border-radius: 13px; background: #eaf1fd; font: inherit; font-size: 12px; font-weight: 700; color: #174ba6">Everyday · 48</button>
          <button style="flex: 1; height: 26px; border: 1px solid #7d8797; border-radius: 13px; background: #ffffff; font: inherit; font-size: 12px; font-weight: 600; color: #353e4c">All toolkits · 412</button>
        </div>
        <div style="height: 26px; line-height: 24px; padding: 0 8px; border: 1px solid #7d8797; border-radius: 5px; color: #353e4c; font-size: 12px">Search commands</div>
      </div>
      <div style="flex: 1; overflow: hidden; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12px">
        <div style="border: 1px solid #d5dbe4; border-radius: 6px; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; background: #eaf1fd; color: #174ba6; font-weight: 700">✉ Email<span style="flex: 1"></span>▾</div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px; padding: 6px">
            <span style="padding: 2px 8px; border: 1px solid #b9c1ce; border-radius: 4px">Read messages</span>
            <span style="padding: 2px 8px; border: 1px solid #1d5fd1; border-radius: 4px; background: #eaf1fd; color: #174ba6; font-weight: 600">Save attachments</span>
            <span style="padding: 2px 8px; border: 1px solid #b9c1ce; border-radius: 4px">Send</span>
            <span style="padding: 2px 8px; border: 1px solid #b9c1ce; border-radius: 4px">Move</span>
          </div>
        </div>
        <div style="border: 1px solid #d5dbe4; border-radius: 6px; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; background: #e6f4ea; color: #14532d; font-weight: 700">▦ Excel<span style="flex: 1"></span>▾</div>
          <div style="display: flex; flex-wrap: wrap; gap: 4px; padding: 6px">
            <span style="padding: 2px 8px; border: 1px solid #b9c1ce; border-radius: 4px">Open workbook</span>
            <span style="padding: 2px 8px; border: 1px solid #b9c1ce; border-radius: 4px">Read range</span>
            <span style="padding: 2px 8px; border: 1px solid #b9c1ce; border-radius: 4px">Write cell</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid #d5dbe4; border-radius: 6px; background: #fdf0e1; color: #7a3e00; font-weight: 700">◫ Browser<span style="flex: 1"></span>▸</div>
        <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid #d5dbe4; border-radius: 6px; background: #f1ebfd; color: #4c1d95; font-weight: 700">↻ Loops and choices<span style="flex: 1"></span>▸</div>
        <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid #d5dbe4; border-radius: 6px; background: #e3f3f7; color: #164e63; font-weight: 700">▤ Files and folders<span style="flex: 1"></span>▸</div>
      </div>
    </aside>
    <main style="flex: 1; min-width: 0; background: #f3f5f8; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px">
      <div style="height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #ffffff; border: 1px solid #d5dbe4; border-radius: 5px">1 · Read messages</div>
      <div style="height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #ffffff; border: 1px solid #d5dbe4; border-radius: 5px">2 · <b>For each</b> message</div>
      <div style="height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px; margin-left: 24px; background: #ffffff; border: 2px solid #1d5fd1; border-radius: 5px">3 · Save attachments</div>
    </main>
    <aside style="width: 280px; flex: none; border-left: 1px solid #d5dbe4; display: flex; flex-direction: column; font-size: 12px">
      <div role="tablist" style="display: flex; height: 32px; border-bottom: 1px solid #d5dbe4">
        <button role="tab" aria-selected="true" style="flex: 1; border: 0; border-bottom: 2px solid #1d5fd1; background: #ffffff; font: inherit; font-weight: 700; color: #174ba6">Settings</button>
        <button role="tab" style="flex: 1; border: 0; background: #ffffff; font: inherit; font-weight: 600; color: #353e4c">Output</button>
        <button role="tab" style="flex: 1; border: 0; background: #ffffff; font: inherit; font-weight: 600; color: #353e4c">On error</button>
      </div>
      <div style="padding: 10px 12px; display: grid; grid-template-columns: 96px 1fr; gap: 6px 8px; align-items: center">
        <label style="font-weight: 600">Message</label><div style="height: 26px; line-height: 24px; padding: 0 8px; border: 1px solid #7d8797; border-radius: 5px">$message$</div>
        <label style="font-weight: 600">Save to</label><div style="height: 26px; line-height: 24px; padding: 0 8px; border: 1px solid #7d8797; border-radius: 5px">C:\Invoices</div>
        <label style="font-weight: 600">Files like</label><div style="height: 26px; line-height: 24px; padding: 0 8px; border: 1px solid #7d8797; border-radius: 5px">*.pdf</div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
